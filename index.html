<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daybook — Your Life Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle light / dark mode">
    <span id="themeIcon">☾</span>
  </button>

  <main class="dashboard">

    <!-- GREETING -->
    <section class="card greeting-card">
      <p class="eyebrow" id="dateDisplay">Loading date…</p>
      <h1 class="greeting" id="greetingText">Good day<span id="userNameDisplay"></span>.</h1>
      <p class="time" id="timeDisplay">00:00:00</p>

      <form id="nameForm" class="name-form">
        <label for="nameInput">What should we call you?</label>
        <div class="name-form-row">
          <input type="text" id="nameInput" placeholder="Your name" maxlength="20" autocomplete="off">
          <button type="submit" class="btn btn-small">Save</button>
        </div>
      </form>
    </section>

    <!-- FOCUS TIMER -->
    <section class="card timer-card">
      <h2 class="card-title">Focus Timer</h2>
      <div class="timer-display" id="timerDisplay">25:00</div>

      <div class="timer-length" id="timerLengthRow">
        <label for="timerLength">Session length</label>
        <select id="timerLength">
          <option value="15">15 min</option>
          <option value="25" selected>25 min</option>
          <option value="45">45 min</option>
          <option value="60">60 min</option>
        </select>
      </div>

      <div class="timer-controls">
        <button id="startBtn" class="btn btn-primary">Start</button>
        <button id="stopBtn" class="btn" disabled>Stop</button>
        <button id="resetBtn" class="btn btn-ghost">Reset</button>
      </div>
      <p class="timer-status" id="timerStatus">Ready when you are.</p>
    </section>

    <!-- TO-DO LIST -->
    <section class="card todo-card">
      <h2 class="card-title">To-Do List</h2>

      <form id="todoForm" class="todo-form">
        <input type="text" id="todoInput" placeholder="Add a task…" autocomplete="off" maxlength="120">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <p class="todo-duplicate-warning" id="todoDuplicateWarning" aria-live="polite"></p>

      <div class="todo-toolbar">
        <div class="todo-filter-group">
          <label for="todoFilter" class="sr-only">Filter tasks</label>
          <select id="todoFilter" aria-label="Filter tasks">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="todo-sort-group">
          <label for="todoSort" class="sr-only">Sort tasks</label>
          <select id="todoSort" aria-label="Sort tasks">
            <option value="default">Order added</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="active-first">Active first</option>
            <option value="done-first">Done first</option>
          </select>
        </div>
      </div>

      <p class="todo-empty-state" id="todoEmptyState">Nothing on your list yet — add your first task above.</p>

      <ul class="todo-list" id="todoList"></ul>

      <p class="todo-count" id="todoCount"></p>
    </section>

    <!-- QUICK LINKS -->
    <section class="card links-card">
      <h2 class="card-title">Quick Links</h2>

      <div class="links-grid" id="linksGrid"></div>

      <form id="linkForm" class="link-form">
        <input type="text" id="linkNameInput" placeholder="Name (e.g. Gmail)" maxlength="18" autocomplete="off">
        <input type="url" id="linkUrlInput" placeholder="https://…" autocomplete="off">
        <button type="submit" class="btn btn-small">Add link</button>
      </form>
    </section>

  </main>

  <footer class="footer">Daybook — everything here stays on your device.</footer>

<script src="js/script.js"></script>
</body>
</html>
